<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Backoffice — Moulins-lès-Metz Handball</title>
<link rel="icon" href="/img/logo.png">
<style>
  :root{
    --bg:#0b0d10;--panel:#14171c;--panel2:#191d23;--line:#262b33;
    --ink:#eef1f5;--muted:#8b93a0;--faint:#5b626d;
    --orange:#F26522;--orange-soft:rgba(242,101,34,.14);--orange-line:rgba(242,101,34,.4);
    --green:#3fb96b;--green-soft:rgba(63,185,107,.14);--green-line:rgba(63,185,107,.4);--red:#e05656;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
  a{color:var(--orange)}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  #login{min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(600px 300px at 50% -10%,rgba(242,101,34,.18),transparent 60%)}
  .card{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .shield{width:44px;height:44px;border-radius:12px;background:conic-gradient(from 210deg,#F26522,#c1440f);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;flex:none}
  .brand b{font-size:15px}.brand span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);font-size:14px;font-family:inherit}
  textarea{min-height:160px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
  .btn{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px}
  .btn.block{width:100%;margin-top:18px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .err{margin-top:14px;background:rgba(224,86,86,.12);border:1px solid rgba(224,86,86,.4);color:#f2a3a3;padding:10px 12px;border-radius:9px;font-size:13px}
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .side .brand{padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;color:var(--muted);background:none;border:0;font-size:13.5px;font-weight:600;text-align:left;width:100%}
  .nav button.active{background:var(--orange-soft);color:var(--ink)}
  .nav button:not(.active):hover{background:#20242b;color:var(--ink)}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--orange-soft);border:1px solid var(--orange-line);display:grid;place-items:center;color:var(--orange);font-weight:800;font-size:12px;flex:none}
  .side-foot .who{font-size:12.5px;font-weight:600;overflow:hidden}
  .side-foot .who .em{color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot .who .lo{display:block;color:var(--faint);font-size:11px;font-weight:500;cursor:pointer}
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line)}
  .topbar h2{font-size:17px;font-weight:800}
  .topbar .btn{margin-left:auto;display:inline-flex;gap:7px;align-items:center;padding:9px 15px;font-size:13px}
  .content{padding:20px 24px;overflow:auto}
  .row{display:grid;grid-template-columns:1fr 150px 118px 116px;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
  .row:hover{background:var(--panel2)}
  .row .t{font-weight:600;display:flex;align-items:center;gap:10px;min-width:0}
  .row .t .thumb{width:36px;height:36px;border-radius:7px;flex:none;background:#222 center/cover;border:1px solid var(--line)}
  .row .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange);justify-self:start;white-space:nowrap}
  .date{font-size:13px;color:var(--muted)}
  .rowact{display:flex;gap:6px;justify-self:end}
  .rowact button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center}
  .rowact button:hover{color:var(--ink)}
  .editor{max-width:760px}
  .editor .field{margin-bottom:16px}
  .editor .hint{font-size:12px;color:var(--faint);margin-top:5px}
  .editbar{display:flex;gap:10px;align-items:center;margin-top:8px}
  .check{display:flex;align-items:center;gap:8px}.check input{width:auto}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
  .gthumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#222}
  .gthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gthumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
  .gthumb button:hover{background:var(--red)}
  .dash{max-width:900px}
  .dash-hero{margin-bottom:22px}
  .dash-hero h3{font-size:20px;font-weight:800}
  .dash-hero p{margin-top:3px}
  .dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
  .dash-card{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--ink);transition:border-color .15s,transform .15s}
  .dash-card:hover{border-color:var(--orange-line);transform:translateY(-2px)}
  .dash-ico{font-size:19px}
  .dash-num{font-size:26px;font-weight:800;line-height:1}
  .dash-lab{font-size:12.5px;color:var(--muted);font-weight:600}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dash-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .dash-block h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:12px}
  .dash-actions{display:flex;flex-direction:column;gap:8px}
  .dash-action{text-align:left;padding:11px 14px;background:var(--orange-soft);border:1px solid var(--orange-line);color:var(--ink);border-radius:9px;font-weight:600;font-size:13.5px}
  .dash-action:hover{background:rgba(242,101,34,.22)}
  .dash-match{display:flex;flex-direction:column;gap:1px;padding:9px 0;border-bottom:1px solid var(--line)}
  .dash-match:last-child{border-bottom:0;padding-bottom:0}
  .dash-match-cat{font-weight:700;font-size:13.5px}
  .dash-match-vs{font-size:13px;color:var(--ink)}
  .dash-match-meta{font-size:12px;color:var(--muted)}
  @media(max-width:700px){.dash-grid{grid-template-columns:1fr}}
  .tl-intro{font-size:13px;margin-bottom:18px}
  .tl-group{margin-bottom:22px}
  .tl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;margin-bottom:2px;border-bottom:1px solid var(--line)}
  .tl-head h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
  .tl-count{font-size:11px;font-weight:700;color:var(--orange);background:var(--orange-soft);border-radius:999px;padding:2px 9px}
  .tl-add{padding:7px 13px!important;font-size:12.5px!important;flex:none}
  .tl-empty{padding:12px 4px;color:var(--faint);font-size:13px}
  .nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700;padding:16px 11px 6px}
  .see-site{display:block;margin:6px 0 10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:none;transition:color .15s,border-color .15s}
  .see-site:hover{color:var(--ink);border-color:var(--orange-line)}
  .grouplist{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .gl-row{display:flex;gap:8px;align-items:center}
  .gl-row input{flex:1}
  .gl-del{flex:none;width:34px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px}
  .gl-del:hover{background:var(--red);color:#fff;border-color:var(--red)}
  .drag{cursor:grab;color:var(--faint);font-size:15px;user-select:none;flex:none}
  .drag:active{cursor:grabbing}
  .row[draggable]{cursor:default}
  .row.dragging{opacity:.45;background:var(--panel2)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101418;border:1px solid var(--line);padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:50}
  .toast.ok{border-color:var(--green-line);color:#a7e9c0}
  .muted{color:var(--muted)}.center{text-align:center;padding:50px 0;color:var(--faint)}
  @media(max-width:760px){
    #app{grid-template-columns:1fr}
    .side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
    .side .brand{border:0;padding:4px 6px;margin:0}.nav{flex-direction:row;flex-wrap:wrap;flex:1}
    .side-foot{margin:0;border:0;padding:0}
    .row{grid-template-columns:1fr auto}.row .chip,.row .date{display:none}
  }
</style>
</head>
<body>
<div id="login">
  <form class="card" onsubmit="doLogin(event)">
    <div class="brand"><span class="shield">MLM</span><div><b>Moulins-lès-Metz</b><span>Moselle Handball</span></div></div>
    <h1 style="font-size:18px">Espace du club</h1>
    <p class="muted" style="font-size:13.5px;margin-top:4px">Connectez-vous pour gérer le site.</p>
    <label>Adresse e-mail</label>
    <input id="li-email" type="email" required autocomplete="username">
    <label>Mot de passe</label>
    <input id="li-pass" type="password" required autocomplete="current-password">
    <div id="li-err" class="err hidden"></div>
    <button class="btn block" type="submit">Se connecter</button>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="shield">MLM</span><div><b>Le club</b><span>Backoffice</span></div></div>
    <nav class="nav" id="nav"></nav>
    <a class="see-site" href="https://moulins-handball.pages.dev" target="_blank" rel="noopener">↗ Voir le site</a>
    <div class="side-foot">
      <span class="avatar" id="ava">?</span>
      <div class="who"><span class="em" id="whoEmail"></span><span class="lo" onclick="logout()">Déconnexion</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="viewTitle">Actualités</h2>
      <button class="btn" id="newBtn" onclick="newEntry()">＋ Nouveau</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
const API="https://moulins-handball-login.theofltr.workers.dev";
let TOKEN=localStorage.getItem("mlm_token")||"";
const CATS=["Séniors Garçons","Séniors Filles","Jeunes","Recrutement","Vie du club","Coupe","Partenaires"];
const TEAMS=["-11 Garçons","-11 Filles","-13 Garçons","-15 Filles","-17 Garçons","Séniors Filles","Séniors 1 Garçons","Séniors 2 Garçons"];
const COLLECTIONS=[
  {id:"actualites",label:"Actualités",folder:"actualites",titleField:"title",chip:"category",date:"date",fields:[
    {name:"title",label:"Titre",type:"text",req:true},{name:"date",label:"Date",type:"datetime"},
    {name:"category",label:"Catégorie",type:"select",options:CATS},{name:"featured",label:"À la une",type:"bool"},
    {name:"image",label:"Image",type:"image"},
    {name:"excerpt",label:"Résumé court",type:"textarea"},{name:"author",label:"Auteur",type:"text"},
    {name:"body",label:"Contenu de l'article",type:"markdown"}]},
  {id:"equipes",label:"Équipes",folder:"equipes",titleField:"name",chip:"championship",fields:[
    {name:"name",label:"Équipe",type:"select",options:TEAMS,req:true},{name:"championship",label:"Championnat / Niveau",type:"text"},
    {name:"coach",label:"Coach",type:"text"},{name:"photo",label:"Photo",type:"image"},
    {name:"order",label:"Ordre d'affichage",type:"number"},{name:"description",label:"Description",type:"textarea"}]},
  {id:"matchs",label:"Matchs / Calendrier",folder:"matchs",titleField:"team_category",chip:"competition",date:"date",fields:[
    {name:"team_category",label:"Catégorie",type:"select",options:TEAMS,req:true},{name:"competition",label:"Compétition",type:"select",options:["Championnat","Coupe"]},
    {name:"journee",label:"Journée (1, 2, 3…)",type:"number",hint:"Numéro de journée du championnat — laisser vide pour la Coupe"},
    {name:"competition_detail",label:"Précision compétition",type:"text"},{name:"date",label:"Date et heure",type:"datetime"},
    {name:"lieu_match",label:"Moulins joue…",type:"select",options:["Domicile","Extérieur"],hint:"À domicile ou à l'extérieur — Moulins s'affiche automatiquement en orange du bon côté"},
    {name:"adversaire",label:"Adversaire",type:"text",hint:"Ex : Sarreguemines HB"},
    {name:"venue",label:"Lieu / Gymnase",type:"text"},
    {name:"score_moulins",label:"Score Moulins",type:"number"},{name:"score_adversaire",label:"Score adversaire",type:"number"},
    {name:"status",label:"Statut",type:"select",options:["À venir","Joué","Reporté","Annulé"]}]},
  {id:"partenaires",label:"Partenaires",folder:"partenaires",titleField:"name",fields:[
    {name:"name",label:"Nom",type:"text",req:true},{name:"logo",label:"Logo",type:"image"},
    {name:"url",label:"Site web",type:"text"},{name:"order",label:"Ordre",type:"number"},{name:"description",label:"Description",type:"textarea"}]},
  {id:"photos",label:"Photothèque",folder:"photos",titleField:"title",date:"date",fields:[
    {name:"title",label:"Titre de l'album",type:"text",req:true},
    {name:"date",label:"Date",type:"datetime"},
    {name:"cover",label:"Photo de couverture",type:"image",hint:"Optionnel — sinon la 1re photo de l'album est utilisée"},
    {name:"photos",label:"Photos de l'album",type:"gallery",hint:"Ajoutez plusieurs photos d'un coup depuis votre téléphone ou votre ordinateur"}]},
];
// Pages « fixes » du site (un seul fichier chacune) éditables directement.
const PAGES=[
  {id:"reglages",label:"Réglages du site",file:"content/settings/site.md",fields:[
    {name:"saison",label:"Saison (affichée sur les équipes)",type:"text"},
    {name:"championnat",label:"Championnat",type:"text"},
    {name:"cta_label",label:"Texte du bouton « Nous rejoindre »",type:"text"},
    {name:"cta_url",label:"Lien du bouton (page contact ou HelloAsso)",type:"text"},
    {name:"email",label:"E-mail du club",type:"text"},
    {name:"gymnase",label:"Gymnase principal",type:"text"},
    {name:"ville",label:"Ville / code postal",type:"text"},
    {name:"facebook",label:"Lien Facebook",type:"text"},
    {name:"instagram",label:"Lien Instagram",type:"text"},
    {name:"youtube",label:"Lien YouTube (optionnel)",type:"text"},
    {name:"footer_description",label:"Texte du pied de page",type:"textarea"}]},
  {id:"page_accueil",label:"Page d'accueil",file:"content/settings/accueil.md",fields:[
    {name:"hero_ligne1",label:"Titre — ligne 1",type:"text"},
    {name:"hero_ligne2",label:"Titre — ligne 2",type:"text"},
    {name:"hero_sous_titre",label:"Phrase d'accroche",type:"text"},
    {name:"stat1_valeur",label:"Chiffre 1 — valeur",type:"text"},{name:"stat1_label",label:"Chiffre 1 — libellé",type:"text"},
    {name:"stat2_valeur",label:"Chiffre 2 — valeur",type:"text"},{name:"stat2_label",label:"Chiffre 2 — libellé",type:"text"},
    {name:"stat3_valeur",label:"Chiffre 3 — valeur",type:"text"},{name:"stat3_label",label:"Chiffre 3 — libellé",type:"text"},
    {name:"recrutement_image",label:"Photo « Rejoins l'aventure » (accueil)",type:"image"},
    {name:"recrutement_image_equipes",label:"Photo « Tu veux nous rejoindre ? » (page Équipes)",type:"image"}]},
  {id:"page_contact",label:"Page Contact",file:"content/pages/contact.md",fields:[
    {name:"hero_title",label:"Titre",type:"text"},
    {name:"hero_accent",label:"Titre — mot en orange",type:"text"},
    {name:"hero_intro",label:"Introduction",type:"textarea"},
    {name:"president",label:"Président",type:"text"},
    {name:"president_tel",label:"Téléphone du président",type:"text"},
    {name:"formspree",label:"URL Formspree (optionnel)",type:"text",hint:"Vide = le formulaire ouvre l'appli mail (mailto). Renseigné = envoi 100% en ligne."}]},
  {id:"page_club",label:"Page Le Club",file:"content/pages/club.md",fields:[
    {name:"hero_title",label:"Titre",type:"text"},
    {name:"hero_accent",label:"Titre — mot en orange",type:"text"},
    {name:"hero_intro",label:"Introduction",type:"textarea"},
    {name:"histoire_titre",label:"Titre de la partie « Notre histoire »",type:"text"},
    {name:"histoire",label:"Texte de l'histoire",type:"markdown"},
    {name:"bureau",label:"Le bureau",type:"grouplist",sub:[{name:"name",label:"Nom"},{name:"role",label:"Rôle"}]},
    {name:"chiffres",label:"Les chiffres du club",type:"grouplist",sub:[{name:"valeur",label:"Valeur (ex. 170)"},{name:"label",label:"Libellé (ex. Licenciés)"}]}]}
];
let CURRENT=null;

async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),...(TOKEN?{"Authorization":"Bearer "+TOKEN}:{})}});
  if(r.status===401){logout();throw new Error("Session expirée.");}
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||"Erreur serveur");
  return d;
}
async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById("li-email").value,pass=document.getElementById("li-pass").value,errEl=document.getElementById("li-err");errEl.classList.add("hidden");
  try{
    const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||"Connexion refusée");
    TOKEN=d.token; localStorage.setItem("mlm_token",TOKEN); startApp(d.email);
  }catch(err){errEl.textContent=err.message;errEl.classList.remove("hidden");}
}
function logout(){TOKEN="";localStorage.removeItem("mlm_token");app.classList.add("hidden");login.classList.remove("hidden");}
function toast(msg,ok){const t=document.createElement("div");t.className="toast"+(ok?" ok":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function esc(s){return(s==null?"":""+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){return iso;}}
function slugify(s){return(s||"element").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"element";}

function startApp(email){
  login.classList.add("hidden");app.classList.remove("hidden");
  whoEmail.textContent=email;ava.textContent=(email[0]||"?").toUpperCase();
  nav.innerHTML="";
  const db=document.createElement("button");db.textContent="Tableau de bord";db.dataset.col="dashboard";db.onclick=()=>openDashboard();nav.appendChild(db);
  COLLECTIONS.forEach(c=>{const b=document.createElement("button");b.textContent=c.label;b.dataset.col=c.id;b.onclick=()=>openCollection(c.id);nav.appendChild(b);});
  const sep=document.createElement("div");sep.className="nav-sep";sep.textContent="Pages du site";nav.appendChild(sep);
  PAGES.forEach(p=>{const b=document.createElement("button");b.textContent=p.label;b.dataset.col=p.id;b.onclick=()=>openPage(p.id);nav.appendChild(b);});
  const sep2=document.createElement("div");sep2.className="nav-sep";sep2.textContent="Administration";nav.appendChild(sep2);
  const acc=document.createElement("button");acc.textContent="Gérer les accès";acc.dataset.col="access";acc.onclick=()=>openAccess();nav.appendChild(acc);
  openDashboard();
}
async function openAccess(){
  CURRENT=null;setActive("access");
  viewTitle.textContent="Gérer les accès";newBtn.classList.add("hidden");
  content.innerHTML='<div class="center">Chargement…</div>';
  try{
    const d=await api("/api/users");const me=d.me,users=d.users||[];
    const rows=users.map(u=>`<div class="row"><div class="t"><span class="avatar" style="width:28px;height:28px;font-size:11px">${esc((u[0]||"?").toUpperCase())}</span><b>${esc(u)}</b>${u===me?' <span class="chip">vous</span>':""}</div><span></span><span></span><div class="rowact">${u===me?"":`<button title="Retirer l'accès" onclick="delUser('${esc(u).replace(/'/g,"&#39;")}')">🗑</button>`}</div></div>`).join("");
    content.innerHTML=`<div class="dash-hero"><h3>Gérer les accès</h3><p class="muted">Les personnes ci-dessous peuvent se connecter au backoffice et modifier le site.</p></div>

function unquote(v){if((v[0]==='"'&&v.endsWith('"'))||(v[0]==="'"&&v.endsWith("'")))return v.slice(1,-1);return v;}
function parseInlineObj(s){const o={};s.replace(/^\{|\}$/g,"").split(/,(?![^{]*\})/).forEach(p=>{const m=p.match(/^\s*([a-zA-Z0-9_]+)\s*:\s*(.*)$/);if(m)o[m[1]]=unquote(m[2].trim());});return o;}
function parseFront(text){
  const m=(text||"").match(/^---\r?\n([\s\S]+?)\r?\n---\r?\n?([\s\S]*)$/);const data={};let body="";
  if(m){body=m[2]||"";const lines=m[1].split(/\r?\n/);
    for(let i=0;i<lines.length;i++){
      const mm=lines[i].match(/^([a-zA-Z0-9_]+):\s*(.*)$/);if(!mm)continue;
      const key=mm[1];let v=mm[2].trim();
      if(v==="|"||v===">"){ // bloc littéral multi-lignes
        const buf=[];while(i+1<lines.length&&(/^\s{2,}\S/.test(lines[i+1])||lines[i+1]==="")){buf.push(lines[i+1].replace(/^\s{2}/,""));i++;}
        while(buf.length&&buf[buf.length-1]==="")buf.pop();
        data[key]=buf.join("\n");
      }else if(v===""){ // liste YAML (lignes « - … » indentées, objets ou simples)
        const arr=[];
        while(i+1<lines.length&&/^\s*-\s+/.test(lines[i+1])){
          let item=lines[i+1].replace(/^\s*-\s+/,"").trim();i++;
          arr.push(item[0]==="{"?parseInlineObj(item):unquote(item));
        }
        data[key]=arr.length?arr:"";
      }else data[key]=unquote(v);
    }}
  data.body=body;return data;
}
function yamlScalar(v){v=""+v;return /[:#,{}"'\n]/.test(v)?'"'+v.replace(/"/g,"'")+'"':v;}
function buildMd(fields){
  let fm="---\n";
  for(const def of CURRENT.fields){
    if(def.name==="body")continue;
    let v=fields[def.name];
    if(def.type==="bool"){fm+=`${def.name}: ${v?"true":"false"}\n`;continue;}
    if(def.type==="gallery"){const arr=Array.isArray(v)?v:[];if(!arr.length)continue;fm+=`${def.name}:\n`+arr.map(s=>`  - ${s}\n`).join("");continue;}
    if(def.type==="grouplist"){const arr=(Array.isArray(v)?v:[]).filter(o=>def.sub.some(s=>o&&o[s.name]));if(!arr.length)continue;fm+=`${def.name}:\n`+arr.map(o=>"  - { "+def.sub.map(s=>`${s.name}: ${yamlScalar(o[s.name]||"")}`).join(", ")+" }").join("\n")+"\n";continue;}
    if(v===undefined||v==="")continue;
    if(/\n/.test(v)){fm+=`${def.name}: |\n`+(""+v).split("\n").map(l=>"  "+l).join("\n")+"\n";continue;}
    if(def.type!=="number"&&/[:#"']/.test(v))v='"'+(""+v).replace(/"/g,"'")+'"';
    fm+=`${def.name}: ${v}\n`;
  }
  return fm+"---\n\n"+(fields.body||"");
}

// Redimensionne (max 1600px) et compresse, sauf petits PNG (logos transparents)
async function prepImage(file){
  let blob=file, filename=file.name;
  const keepPng=file.type==="image/png"&&file.size<800*1024;
  if(!keepPng){
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file);});
    const scale=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
    filename=filename.replace(/\.[^.]+$/,"")+".jpg";
  }
  return {blob,filename};
}
function toB64(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=ko;r.readAsDataURL(blob);});}
async function uploadImage(id){

  const state=document.getElementById(id+"_state");
  state.textContent="Préparation de l'image…";
  try{
    const {blob,filename}=await prepImage(file);
    state.textContent="Envoi en cours…";
    const b64=await toB64(blob);
    const d=await api("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename,dataBase64:b64})});
    document.getElementById(id).value=d.path;
    const prev=document.getElementById(id+"_prev");prev.src=URL.createObjectURL(blob);prev.style.display="";
    state.textContent="Photo ajoutée ✓";
  }catch(e){state.textContent="";toast("Erreur d'envoi : "+e.message);}
  fileInp.value="";
}
async function editEntry(path){
  content.innerHTML='<div class="center">Chargement…</div>';
  try{const d=await api("/api/file?path="+encodeURIComponent(path));renderEditor(path,parseFront(d.content));}catch(e){toast(e.message);}
}
async function dupEntry(path){
  content.innerHTML='<div class="center">Chargement…</div>';
  try{const d=await api("/api/file?path="+encodeURIComponent(path));const data=parseFront(d.content);
    if(CURRENT.titleField&&data[CURRENT.titleField])data[CURRENT.titleField]=data[CURRENT.titleField]+" (copie)";
    renderEditor("",data);toast("Copie prête — modifiez puis publiez.");
  }catch(e){toast(e.message);}
}
async function saveEntry(path){
  const fields={};
  for(const def of CURRENT.fields){const inp=document.getElementById("fld_"+def.name);if(!inp)continue;if(def.type==="bool")fields[def.name]=inp.checked;else if(def.type==="gallery"||def.type==="grouplist"){try{fields[def.name]=JSON.parse(inp.value||"[]")}catch(e){fields[def.name]=[]}}else fields[def.name]=inp.value;}
  fields.body=fields.body||"";
  for(const def of CURRENT.fields){if(def.req&&!fields[def.name]){toast("Champ requis : "+def.label);return;}}
  let p=CURRENT.file||path;
  if(!p){const base=slugify(fields[CURRENT.titleField]||"element");const dp=CURRENT.date&&fields[CURRENT.date]?fields[CURRENT.date].slice(0,10)+"-":"";p=`content/${CURRENT.folder}/${dp}${base}.md`;}
  try{toast("Publication en cours…");await api("/api/file",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:p,content:buildMd(fields)})});toast("Publié ✓ Le site se met à jour (~2 min).",true);CURRENT.file?openPage(CURRENT.id):openCollection(CURRENT.id);}catch(e){toast("Erreur : "+e.message);}
}
async function delEntry(path,title){
  if(!confirm("Supprimer « "+title+" » ? Action définitive."))return;
  try{await api("/api/file?path="+encodeURIComponent(path),{method:"DELETE"});toast("Supprimé ✓",true);openCollection(CURRENT.id);}catch(e){toast("Erreur : "+e.message);}
}
(async function(){
  if(TOKEN){try{const me=await api("/api/me");startApp(me.email);return;}catch(e){}}
  login.classList.remove("hidden");
})();
</script>
