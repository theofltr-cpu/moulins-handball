<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Moulins-lès-Metz Handball</title>
  <link rel="icon" href="../img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;

      /* Accent orange du club */
      --primary-accent-color: #F26522;
      --primary-accent-color-translucent: rgba(242, 101, 34, 0.15);
      --primary-accent-color-light: #ff7a35;
      --primary-accent-color-dark: #c44d12;
      --accent-color: #F26522;
      --highlight-color: #F26522;
      --link-color: #F26522;

      /* Surface sombre */
      --background-primary-color: #0a0a0a;
      --background-secondary-color: #161616;
      --background-tertiary-color: #1f1f1f;
      --foreground-color: #ffffff;
      --secondary-foreground-color: #b8b8b8;

      /* Typographie */
      --font-family-primary: 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-family-headline: 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0a0a0a;
      color: #fff;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    /* Fond visuel de l'écran de connexion : photo équipe + overlay sombre orange */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(135deg, rgba(10, 10, 10, 0.78) 0%, rgba(10, 10, 10, 0.95) 100%),
        radial-gradient(circle at 20% 80%, rgba(242, 101, 34, 0.18) 0%, transparent 60%),
        url('../img/hero-team.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
      pointer-events: none;
    }

    /* Anim subtile à l'ouverture */
    body { animation: fadein 0.4s ease-out; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
