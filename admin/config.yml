backend:
  name: github
  repo: theofltr-cpu/moulins-handball
  branch: main
  base_url: https://moulins-handball-oauth.theofltr.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: img/uploads
public_folder: /img/uploads

site_url: https://moulins-handball.pages.dev
display_url: https://moulins-handball.pages.dev
logo_url: /img/logo.png

locale: fr

collections:
  - name: reglages
    label: Réglages du site
    delete: false
    editor: { preview: false }
    files:
      - name: site
        label: Réglages généraux
        file: content/settings/site.md
        fields:
          - { name: saison, label: "Bandeau — Saison", widget: string, required: false }
          - { name: championnat, label: "Bandeau — Championnat", widget: string, required: false }
          - { name: cta_label, label: "Bouton en-tête — Texte", widget: string, default: "Nous rejoindre" }
          - { name: cta_url, label: "Bouton en-tête — Lien", widget: string, hint: "Page interne (ex : contact.html) ou lien HelloAsso complet (https://...)" }
          - { name: footer_description, label: "Pied de page — Description du club", widget: text }
          - { name: email, label: "Email de contact", widget: string }
          - { name: gymnase, label: "Gymnase", widget: string }
          - { name: ville, label: "Ville / Code postal", widget: string }
          - { name: facebook, label: "Lien Facebook", widget: string, required: false, hint: "Mettre # si pas de page" }
          - { name: instagram, label: "Lien Instagram", widget: string, required: false, hint: "Mettre # si pas de page" }
          - { name: youtube, label: "Lien YouTube", widget: string, required: false, hint: "Mettre # si pas de chaîne" }
      - name: accueil
        label: Page d'accueil
        file: content/settings/accueil.md
        fields:
          - { name: hero_ligne1, label: "Titre — ligne 1", widget: string }
          - { name: hero_ligne2, label: "Titre — ligne 2", widget: string }
          - { name: hero_sous_titre, label: "Phrase d'accroche", widget: string }
          - { name: stat1_valeur, label: "Chiffre 1 — valeur", widget: string }
          - { name: stat1_label, label: "Chiffre 1 — libellé", widget: string }
          - { name: stat2_valeur, label: "Chiffre 2 — valeur", widget: string }
          - { name: stat2_label, label: "Chiffre 2 — libellé", widget: string }
          - { name: stat3_valeur, label: "Chiffre 3 — valeur", widget: string }
          - { name: stat3_label, label: "Chiffre 3 — libellé", widget: string }
          - { name: stat4_valeur, label: "Chiffre 4 — valeur", widget: string }
          - { name: stat4_label, label: "Chiffre 4 — libellé", widget: string }

  - name: actualites
    label: Actualités
    label_singular: Actualité
    folder: content/actualites
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date de publication, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { name: category, label: Catégorie, widget: select, options: ["Séniors Garçons", "Séniors Filles", "Jeunes", "Recrutement", "Vie du club", "Coupe", "Partenaires"] }
      - { name: featured, label: Mettre en avant sur la home, widget: boolean, default: false }
      - { name: image, label: Image principale, widget: image, required: false }
      - { name: excerpt, label: Résumé court, widget: text, hint: "1-2 phrases qui apparaissent dans la liste des actus" }
      - { name: body, label: Contenu, widget: markdown }
      - { name: author, label: Auteur, widget: string, required: false, default: "Le bureau" }

  - name: equipes
    label: Équipes
    label_singular: Équipe
    folder: content/equipes
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Nom de l'équipe, widget: select, options: ["-11 Garçons", "-11 Filles", "-13 Garçons", "-15 Filles", "-17 Garçons", "Séniors Filles", "Séniors 1 Garçons", "Séniors 2 Garçons"], hint: "Doit correspondre à la catégorie utilisée pour les matchs (pour relier la fiche au bon calendrier)" }
      - { name: championship, label: Championnat / Niveau, widget: string, required: false, hint: "Ex : Honneur Régional, Honneur Départemental" }
      - { name: coach, label: Coach principal, widget: string, required: false }
      - { name: schedule, label: Horaires d'entraînement, widget: string, required: false, hint: "Ex : Mardi & Jeudi 18h-20h" }
      - { name: venue, label: Gymnase / Lieu d'entraînement, widget: string, required: false, hint: "Ex : Gymnase de Frescaty" }
      - { name: photo, label: Photo équipe, widget: image, required: false }
      - { name: order, label: Ordre d'affichage, widget: number, default: 0, hint: "Plus le chiffre est petit, plus l'équipe apparaît en premier" }
      - { name: description, label: Description, widget: text, required: false }

  - name: matchs
    label: Matchs / Calendrier
    label_singular: Match
    folder: content/matchs
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD/MM HH:mm')}} · {{home_team}} vs {{away_team}}"
    sortable_fields: [date]
    fields:
      - { name: date, label: Date et heure du match, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { name: competition, label: Compétition, widget: select, options: ["Championnat", "Coupe"], default: "Championnat" }
      - { name: competition_detail, label: "Précision compétition (optionnel)", widget: string, required: false, hint: "Ex : Honneur Régional, Coupe de Moselle 1/8 — laisser vide si inutile" }
      - { name: team_category, label: Catégorie d'équipe, widget: select, options: ["-11 Garçons", "-11 Filles", "-13 Garçons", "-15 Filles", "-17 Garçons", "Séniors Filles", "Séniors 1 Garçons", "Séniors 2 Garçons"] }
      - { name: home_team, label: Équipe à domicile, widget: string, default: "Moulins-lès-Metz" }
      - { name: away_team, label: Équipe à l'extérieur, widget: string }
      - { name: venue, label: Lieu / Gymnase, widget: string }
      - { name: home_score, label: Score domicile, widget: number, required: false, hint: "Laisser vide si le match n'a pas encore eu lieu" }
      - { name: away_score, label: Score extérieur, widget: number, required: false }
      - { name: status, label: Statut, widget: select, options: ["À venir", "Joué", "Reporté", "Annulé"], default: "À venir" }
      - { name: notes, label: Notes, widget: text, required: false }

  - name: joueurs
    label: Joueurs
    label_singular: Joueur
    folder: content/joueurs
    create: true
    slug: "{{slug}}"
    summary: "{{name}} (#{{number}}) — {{team}}"
    fields:
      - { name: name, label: Nom complet, widget: string }
      - { name: number, label: Numéro de maillot, widget: number, required: false }
      - { name: position, label: Poste, widget: select, options: ["Gardien", "Pivot", "Arrière", "Demi-centre", "Ailier", "Autre"], required: false }
      - { name: team, label: Équipe, widget: string, hint: "Ex : Séniors Garçons" }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: bio, label: Bio courte, widget: text, required: false }

  - name: partenaires
    label: Partenaires / Sponsors
    label_singular: Partenaire
    folder: content/partenaires
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Nom, widget: string }
      - { name: logo, label: Logo, widget: image }
      - { name: url, label: Site web, widget: string, required: false }
      - { name: order, label: Ordre d'affichage, widget: number, default: 0 }
      - { name: description, label: Description, widget: text, required: false }

  - name: pages
    label: Pages fixes
    label_singular: Page
    files:
      - name: club
        label: Page Le Club
        file: content/pages/club.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: subtitle, label: Sous-titre, widget: string }
          - { name: history, label: Notre histoire, widget: markdown }
          - { name: values_intro, label: Intro Valeurs, widget: string, required: false }

      - name: contact
        label: Page Contact
        file: content/pages/contact.md
        fields:
          - { name: email, label: Email principal, widget: string }
          - { name: address, label: Adresse, widget: text }
          - { name: president_name, label: Nom du président, widget: string }
          - { name: president_phone, label: Téléphone président, widget: string, required: false }
          - { name: facebook_url, label: URL Facebook, widget: string, required: false }
          - { name: instagram_url, label: URL Instagram, widget: string, required: false }
          - { name: youtube_url, label: URL YouTube, widget: string, required: false }
